<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://datacaddy.co/pt-br/" />
    <!-- This page is for people who are given the link, not for search results:
         DataCaddy sells into the United States. `noindex` keeps it out of the
         index; `follow` keeps the links it contains meaningful. It must stay
         CRAWLABLE for this to be read at all, which is why robots.txt says
         Allow — a Disallow would hide this instruction, not enforce it. -->
    <meta name="robots" content="noindex, follow" />
    <!-- title / description / og:* injected by siteMeta() -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
